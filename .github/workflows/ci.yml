name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Raceday.API.sln

    - name: Build solution
      run: dotnet build Raceday.API.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Raceday.API.sln --no-build --configuration Release --verbosity normal
